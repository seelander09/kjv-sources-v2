version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.13.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt -r api_requirements.txt &&
      python -m uvicorn src.kjv_sources.api:app --host 0.0.0.0 --port 8001"
    environment:
      - PYTHONPATH=/app
      - ALLOW_FILE_ORIGIN=false
      - REQUIRE_API_KEY=false
    volumes:
      - ./:/app
    ports:
      - "8001:8001"
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
